
name: Build Atadwe Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Atadwe-Mobile-Android-Project.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -n 1)")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Atadwe-Mobile-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
